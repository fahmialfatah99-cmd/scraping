[project]
name = "advanced-scraper"
version = "0.1.0"
description = "Advanced, resilient, and stealth Python web scraper."
requires-python = ">=3.10"
dependencies = [
    "httpx[http2]>=0.27.0",
    "playwright>=1.42.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.6.0",
    "loguru>=0.7.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
